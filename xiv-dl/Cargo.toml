[package]
name = "xiv-dl"
description = "FFXIV Downloader via CLUT files"
version = "0.1.0"
edition = "2024"

[dependencies]
binrw = "0.15"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["stream", "json"] }
clap = { version = "4.5", features = ["derive"] }
itertools = "0.14"
flate2 = "1.0"
brotli = "8.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
futures = "0.3"
url = "2.5"
log = "0.4"
async-stream = "0.3"
async-trait = "0.1"
env_logger = "0.11"
http-range-header = "0.4"
regex = "1.0"
num_cpus = "1.0"
multer = { version = "3.1", features = ["log", "tokio-io"] }
http-content-range = "0.2"
either = "1.15"
graphql_client = "0.14"
shadow-rs = { version = "1.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
shadow-rs = "1.2"
