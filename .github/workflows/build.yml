name: Build and Release
on: push

jobs:
  build:
    name: Build ${{matrix.os-name}}
    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      matrix:
        include:
          - os-name: linux-x64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os-name: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - os-name: win-x64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            binary-ext: .exe

          - os-name: win-arm64
            runs-on: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary-ext: .exe

          - os-name: osx-x64
            runs-on: macOS-latest
            target: x86_64-apple-darwin

          - os-name: osx-arm64
            runs-on: macOS-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          working-directory: rust
          args: "--locked --release --bin xiv-dl"
          strip: true

      - name: Rename Binary
        shell: bash
        run: |
          mv -f rust/target/${{ matrix.target }}/release/xiv-dl${{ matrix.binary-ext }} xiv-dl-${{ matrix.os-name }}${{ matrix.binary-ext }}

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            xiv-dl-${{ matrix.os-name }}${{ matrix.binary-ext }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiv-dl-${{ matrix.os-name }}
          path: |
            xiv-dl-${{ matrix.os-name }}${{ matrix.binary-ext }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          submodules: recursive

      - name: Check Version
        id: version
        uses: issue-ops/semver@v3
        with:
          manifest-path: action.yml
          workspace: ${{ github.workspace }}

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} does not exist"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download All Builds
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
          files: |
            artifacts/*/*

      - name: Publish Release
        shell: bash
        run: |
          newest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | sort -V | tail -1)
          [ "$newest" = "v$VERSION" ] && latest=true || latest=false
          gh release edit "v$VERSION" --draft=false --latest="$latest"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
