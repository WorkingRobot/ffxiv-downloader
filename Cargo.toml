[package]
name = "xiv-dl"
version = "0.1.0"
edition = "2024"

[dependencies]
binrw = "0.14"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
clap = { version = "4.0", features = ["derive"] }
flate2 = "1.0"
brotli = "6.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
bytes = "1.0"
