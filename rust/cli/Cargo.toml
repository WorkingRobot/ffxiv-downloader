[package]
name = "xiv-dl-cli"
description = "FFXIV Downloader via CLUT files"
authors = ["Asriel Camora <asriel@camora.dev>"]
license = "GPL-3.0"
repository = "https://github.com/WorkingRobot/ffxiv-downloader"
edition = "2024"

[[bin]]
name = "xiv-dl"
path = "src/main.rs"

[dependencies]
xiv-dl-core = { path = "../core" }
shadow-rs = { version = "1.2", default-features = false }
tokio = { version = "1.47", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
bytes = "1.0"
futures = "0.3"
url = "2.5"
either = "1.15"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
env_logger = "0.11"
regex = "1.0"
num_cpus = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
shadow-rs = "1.2"
